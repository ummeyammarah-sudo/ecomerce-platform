<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Shop - Buy Your Favorite Pets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>🐾 Lovely Pet Shop</h1>
        <p>Apna pasandida pet aaj hi ghar le jayein!</p>
    </header>

    <!-- Pets Listing Section -->
    <main class="pet-container">
        <!-- Pet 1 -->
        <div class="pet-card">
            <img src="https://unsplash.com" alt="Dog">
            <h3>Cute Puppy</h3>
            <p>Umar: 2 Mahine | Active aur Friendly</p>
            <p class="price">Rs. 15,000</p>
            <button onclick="buyPet('Cute Puppy')">Abhi Kharidein</button>
        </div>

        <!-- Pet 2 -->
        <div class="pet-card">
            <img src="https://unsplash.com" alt="Cat">
            <h3>Persian Cat</h3>
            <p>Umar: 3 Mahine | Soft aur Pyari</p>
            <p class="price">Rs. 20,000</p>
            <button onclick="buyPet('Persian Cat')">Abhi Kharidein</button>
        </div>

        <!-- Pet 3 -->
        <div class="pet-card">
            <img src="https://unsplash.com" alt="Parrot">
            <h3>Talking Parrot</h3>
            <p>Umar: 5 Mahine | Bolna seekh raha hai</p>
            <p class="price">Rs. 8,000</p>
            <button onclick="buyPet('Talking Parrot')">Abhi Kharidein</button>
        </div>
    </main>

    <footer>
        <p>© 2026 Pet Shop | GitHub Pages par Host Kiya Gaya</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
